repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: pnpm exec prettier --write --ignore-unknown
        types: [text]
        stages: [pre-commit]
      - id: eslint
        name: eslint
        language: system
        entry: pnpm exec eslint
        files: \.(js|mjs|cjs|ts|vue)$
        stages: [pre-push]
